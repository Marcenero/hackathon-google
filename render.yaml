services:
  - type: web
    name: raiz-viva-api
    runtime: python
    plan: free
    branch: prototipo
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: '3.13.12'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYSIS_PER_MINUTE
        value: '12'
      - key: ANALYSIS_PER_DAY
        value: '120'
      - key: ANALYSIS_CONCURRENCY
        value: '2'
